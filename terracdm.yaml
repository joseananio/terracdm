# Server-only TerraCDM instance configuration.
# Keep credentials in environment variables; never put secret values here.
version: 1

packs:
  # Use `disabled` to make the entries below an allow-list.
  defaults: enabled
  entries: {}

# Optional Craven ontology bindings. Keep the API token in CRAVEN_API_TOKEN.
# semanticBackend:
#   mappings:
#     supply-chain:
#       ontologyPackageId: 00000000-0000-4000-8000-000000000000
#       typeRef: Supplier

# Example:
#
# packs:
#   defaults: disabled
#   entries:
