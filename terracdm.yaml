#       enabled: true
#       providers:
#         aviation-network:
#           pollSeconds: 120
#           cache:
#             maxAgeSeconds: 120
#             staleIfErrorSeconds: 600
#     air-quality:
#       enabled: true
#       source: ./packs/air-quality.yaml
